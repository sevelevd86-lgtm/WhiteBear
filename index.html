<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошелёк</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #0a1628;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #142a4a;
            padding: 40px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 24px;
            color: #6ab0ff;
            margin-bottom: 10px;
        }
        .balance {
            font-size: 48px;
            font-weight: 900;
            color: #ffd84d;
            margin: 25px 0;
        }
        .hint {
            color: #8ab4d8;
            font-size: 13px;
            line-height: 1.5;
        }
        .refresh-btn {
            margin-top: 20px;
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            background: #2a7ad8;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }
        .refresh-btn:active { transform: scale(0.96); }
        .footer {
            margin-top: 25px;
            color: #5a8aaa;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Мой баланс</h1>
        <div class="balance" id="balanceDisplay">0 ⭐</div>
        <p class="hint">Пополнить баланс можно в чате с ботом</p>
        <button class="refresh-btn" id="refreshBtn">🔄 Обновить</button>
        <div class="footer">Данные синхронизируются с ботом</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const balanceDisplay = document.getElementById('balanceDisplay');
        const refreshBtn = document.getElementById('refreshBtn');

        // Получаем user_id из Telegram
        const user_id = tg.initDataUnsafe?.user?.id;

        async function fetchBalance() {
            if (!user_id) {
                balanceDisplay.textContent = '❌ Ошибка';
                return;
            }
            try {
                const response = await fetch(`https://whitebear.bothost.tech/api/balance/${user_id}`);
                const data = await response.json();
                balanceDisplay.textContent = `${data.balance} ⭐`;
            } catch (error) {
                balanceDisplay.textContent = '⚠️ Ошибка загрузки';
                console.error(error);
            }
        }

        // Загружаем при открытии
        fetchBalance();

        // По кнопке обновить
        refreshBtn.addEventListener('click', fetchBalance);
    </script>
</body>
</html>
