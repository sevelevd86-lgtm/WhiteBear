<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошелёк</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a1628;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #142a4a;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        h1 { color: #6ab0ff; }
        .balance {
            font-size: 36px;
            font-weight: 900;
            color: #ffd84d;
            margin: 20px 0;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary {
            background: #2a7ad8;
            color: white;
        }
        .btn-danger {
            background: #c04060;
            color: white;
        }
        .btn:active { transform: scale(0.95); }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #2a7ad8;
            background: #0a1628;
            color: white;
            font-size: 18px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Кошелёк</h1>
        <div class="balance" id="balanceDisplay">0 ⭐</div>
        <input type="number" id="amountInput" placeholder="Сумма" value="100" min="1">
        <div class="btn-group">
            <button class="btn btn-primary" id="depositBtn">Пополнить</button>
            <button class="btn btn-danger" id="withdrawBtn">Вывести</button>
        </div>
        <p style="margin-top:20px; color:#8ab4d8; font-size:12px;">Баланс синхронизируется с ботом</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();  // растянуть на весь экран

        const balanceDisplay = document.getElementById('balanceDisplay');
        const amountInput = document.getElementById('amountInput');
        const depositBtn = document.getElementById('depositBtn');
        const withdrawBtn = document.getElementById('withdrawBtn');

        // Пример: можем получить начальный баланс из данных пользователя, но мы не храним его тут
        // Лучше запросить у бота через sendData, но для простоты покажем заглушку
        // Реальный баланс хранится у бота, мы его не знаем, но можем отобразить после обновления

        function sendAction(action, amount) {
            tg.sendData(JSON.stringify({ action, amount }));
        }

        depositBtn.addEventListener('click', () => {
            const amount = parseInt(amountInput.value);
            if (amount > 0) {
                sendAction('deposit', amount);
                // можно показать локальное изменение, но лучше дождаться ответа от бота
                // Однако ответ от бота придёт в чат, а не в приложение.
                // Поэтому после отправки закрываем приложение или показываем уведомление.
                tg.showAlert(`Пополнение на ${amount} ⭐ отправлено!`);
                tg.close();
            } else {
                tg.showAlert('Введите корректную сумму');
            }
        });

        withdrawBtn.addEventListener('click', () => {
            const amount = parseInt(amountInput.value);
            if (amount > 0) {
                sendAction('withdraw', amount);
                tg.showAlert(`Запрос на вывод ${amount} ⭐ отправлен!`);
                tg.close();
            } else {
                tg.showAlert('Введите корректную сумму');
            }
        });

        // Получить баланс от бота можно через sendData с запросом, но для простоты оставим так.
        // Можно также при открытии приложения отправить запрос на получение баланса, но бот должен ответить.
        // В этом примере упрощённо.
    </script>
</body>
</html>
