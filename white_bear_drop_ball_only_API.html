<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>White Bear Drop — Шарик</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#070b11;color:#fff}
body{position:fixed;inset:0}
button,input{font:inherit}
.hidden{display:none!important}
#app{position:fixed;inset:0;background:#070b11}
#home{position:absolute;inset:0;padding:20px 16px 100px;overflow:auto}
.header{display:flex;align-items:center;justify-content:space-between;max-width:700px;margin:0 auto 25px}
.logo{font-size:22px;font-weight:900;letter-spacing:1px}
.balance{background:rgba(14,24,39,.9);border:1px solid rgba(70,150,255,.2);border-radius:13px;padding:10px 13px;font-weight:800}
.game-card{width:min(390px,100%);margin:80px auto 0;padding:25px;border-radius:22px;background:linear-gradient(145deg,#0e1827,#070d17);border:1px solid rgba(50,140,255,.25);box-shadow:0 25px 80px rgba(0,0,0,.5);text-align:center}
.game-icon{font-size:70px;margin-bottom:8px}
.game-title{font-size:30px;font-weight:900;letter-spacing:2px}
.game-desc{color:#8492a7;margin:8px 0 22px}
.open-btn{width:100%;height:50px;border:0;border-radius:13px;background:linear-gradient(135deg,#1684ff,#0756b7);color:#fff;font-weight:900;cursor:pointer}
.bottom{position:fixed;left:0;right:0;bottom:0;height:76px;background:rgba(7,12,20,.96);border-top:1px solid rgba(100,150,220,.12);display:grid;grid-template-columns:repeat(3,1fr);z-index:100}
.bottom button{border:0;background:none;color:#718096;font-weight:800}
.bottom button.active{color:#fff}
#gameScreen{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,rgba(20,120,235,.08),transparent 35%),#070b11;z-index:200}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.game-top{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 24px));display:grid;grid-template-columns:repeat(3,1fr);gap:10px;z-index:10}
.game-stat{padding:11px 10px;text-align:center;background:rgba(9,16,28,.82);border:1px solid rgba(70,150,255,.18);border-radius:13px;backdrop-filter:blur(10px)}
.game-stat-label{font-size:10px;color:#7f8da3;text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}
.game-stat-value{font-size:17px;font-weight:800;color:#eef6ff}
.bottom-zones{position:absolute;bottom:0;left:0;width:100%;height:90px;display:flex;z-index:5;font-weight:900;font-size:25px;letter-spacing:1px}
.green-zone,.red-zone{height:100%;display:flex;align-items:center;justify-content:center;transition:width .25s ease}
.green-zone{width:70%;background:linear-gradient(180deg,rgba(17,220,115,.95),rgba(4,125,65,.98));color:#eafff3}
.red-zone{width:30%;background:linear-gradient(180deg,rgba(235,55,75,.95),rgba(125,15,32,.98));color:#fff}
.game-menu,.result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(390px,calc(100% - 30px));padding:27px 22px 23px;background:linear-gradient(145deg,rgba(14,24,39,.97),rgba(7,13,23,.97));border:1px solid rgba(50,140,255,.25);border-radius:22px;box-shadow:0 25px 80px rgba(0,0,0,.55),0 0 45px rgba(20,120,235,.08);z-index:30;text-align:center;backdrop-filter:blur(18px)}
.game-menu-title{font-size:34px;font-weight:900;letter-spacing:4px;margin-bottom:7px}
.game-menu-balance{color:#82bfff;font-size:14px;margin-bottom:20px}
.bet-input{width:100%;height:48px;padding:0 15px;border-radius:12px;border:1px solid rgba(90,160,255,.22);outline:0;background:rgba(3,9,17,.9);color:#fff;font-size:17px;font-weight:700;text-align:center;margin-bottom:8px}
.bet-error{min-height:18px;color:#ff5d6f;font-size:12px;margin-bottom:10px}
.difficulty{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:15px}
.difficulty button{height:43px;border:1px solid rgba(100,160,230,.15);border-radius:10px;background:rgba(19,31,48,.8);color:#9caabe;font-weight:700;cursor:pointer}
.difficulty button.active{color:#fff;background:linear-gradient(135deg,#1478e8,#0955b1);border-color:rgba(90,175,255,.7)}
.start-game,.result-close{width:100%;height:50px;border:0;border-radius:13px;background:linear-gradient(135deg,#1684ff,#0756b7);color:#fff;font-size:16px;font-weight:900;cursor:pointer}
.exit-game{width:100%;height:43px;margin-top:8px;border:1px solid rgba(100,150,210,.15);border-radius:11px;background:rgba(20,31,47,.65);color:#8492a7;font-weight:700;cursor:pointer}
.result{z-index:40;padding:30px 23px}
.result-title{font-size:40px;font-weight:1000;letter-spacing:3px;margin-bottom:12px}
.result-title.win{color:#34ed8a}.result-title.lose{color:#ff4e68}
.result-info{color:#9caabd;line-height:1.7;font-size:14px;margin-bottom:14px}
.result-money{font-size:25px;font-weight:900;margin-bottom:20px}
.result-money.win{color:#39ed91}.result-money.lose{color:#ff536b}
.api-status{font-size:12px;font-weight:800;margin-top:10px}
.api-ok{color:#39ed91}.api-bad{color:#ff536b}
@media(max-width:600px){.game-top{top:10px;width:calc(100% - 16px);gap:6px}.game-stat{padding:9px 5px;border-radius:10px}.game-stat-label{font-size:9px}.game-stat-value{font-size:14px}.bottom-zones{height:75px;font-size:20px}.game-menu,.result{padding:23px 17px 18px;border-radius:18px}.game-menu-title{font-size:29px}.result{padding:26px 18px}}
</style>
</head>
<body>
<div id="app">
  <div id="home">
    <div class="header">
      <div class="logo">🐻‍❄️ WHITE BEAR DROP</div>
      <div class="balance">⭐ <span id="homeBalance">0.00</span></div>
    </div>
    <div class="game-card">
      <div class="game-icon">⚪</div>
      <div class="game-title">ШАРИК</div>
      <div class="game-desc">ESCAPE — доберись до зелёной зоны</div>
      <button class="open-btn" id="openBall">ИГРАТЬ</button>
      <div class="api-status api-bad" id="apiStatus">API: проверка...</div>
    </div>
  </div>
  <div class="bottom">
    <button id="navInventory">🎒<br>Инвентарь</button>
    <button id="navMenu" class="active">🎮<br>Меню</button>
    <button id="navProfile">👤<br>Профиль</button>
  </div>

  <div id="gameScreen" class="hidden">
    <canvas id="gameCanvas"></canvas>
    <div class="game-top">
      <div class="game-stat"><div class="game-stat-label">Баланс</div><div class="game-stat-value" id="gameBalance">0.00</div></div>
      <div class="game-stat"><div class="game-stat-label">Отскоки</div><div class="game-stat-value" id="gameBounces">0</div></div>
      <div class="game-stat"><div class="game-stat-label">Множитель</div><div class="game-stat-value" id="gameMultiplier">1.00x</div></div>
    </div>
    <div class="bottom-zones"><div id="greenZone" class="green-zone">WIN</div><div id="redZone" class="red-zone">LOSE</div></div>
    <div id="gameMenu" class="game-menu">
      <div class="game-menu-title">ESCAPE</div>
      <div class="game-menu-balance" id="gameMenuBalance">Баланс: 0.00 ⭐</div>
      <input id="gameBet" class="bet-input" type="number" min="25" step="1" value="100" placeholder="Ставка">
      <div id="gameBetError" class="bet-error"></div>
      <div class="difficulty">
        <button data-difficulty="easy" class="active">Легко</button>
        <button data-difficulty="medium">Средне</button>
        <button data-difficulty="hard">Сложно</button>
      </div>
      <button class="start-game" id="startGame">ИГРАТЬ</button>
      <button class="exit-game" id="exitGame">НАЗАД</button>
    </div>
    <div id="gameResult" class="result hidden">
      <div id="resultTitle" class="result-title win">WIN</div>
      <div id="resultInfo" class="result-info"></div>
      <div id="resultMoney" class="result-money win"></div>
      <button id="resultClose" class="result-close">ЗАКРЫТЬ</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const API_BASE="https://whitebear.bothost.tech";
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(tg){tg.ready();tg.expand();}
const initData=tg&&tg.initData?tg.initData:"";
let userId=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user.id:null;
let balance=0;

function headers(){
  const h={"Content-Type":"application/json"};
  if(initData)h["X-Telegram-Init-Data"]=initData;
  return h;
}
async function api(path,options){
  const r=await fetch(API_BASE+path,Object.assign({headers:headers()},options||{}));
  let data={};
  try{data=await r.json()}catch(e){}
  if(!r.ok)throw new Error(data.detail||data.message||"Ошибка API");
  return data;
}
function setBalance(v){
  balance=Number(v)||0;
  document.getElementById("homeBalance").textContent=balance.toFixed(2);
  document.getElementById("gameBalance").textContent=balance.toFixed(2);
  document.getElementById("gameMenuBalance").textContent="Баланс: "+balance.toFixed(2)+" ⭐";
}
async function loadBalance(){
  if(!userId){
    document.getElementById("apiStatus").textContent="API: откройте через Telegram";
    document.getElementById("apiStatus").className="api-status api-bad";
    return;
  }
  try{
    const d=await api("/api/balance/"+userId);
    setBalance(d.balance);
    document.getElementById("apiStatus").textContent="API: подключено";
    document.getElementById("apiStatus").className="api-status api-ok";
  }catch(e){
    document.getElementById("apiStatus").textContent="API: ошибка";
    document.getElementById("apiStatus").className="api-status api-bad";
  }
}
async function gameTransaction(type,amount,operation_id){
  return api("/api/game/transaction",{method:"POST",body:JSON.stringify({
    user_id:Number(userId),operation_id,type,amount,game:"ball"
  })});
}

const canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d");
let width=0,height=0;
const circle={x:0,y:0,radius:205,wallWidth:10};
const ball={x:0,y:0,vx:0,vy:0,radius:13};
const GRAVITY=.20,MAX_SPEED=6.2,MAX_HORIZONTAL_SPEED=3.8,SIDE_WALL=7,ZONE_HEIGHT=90,HOLE_SPEED=.018;
let holeAngle=0,gameRunning=false,escaped=false,gameFinished=false,bounceCount=0,multiplier=1,currentBet=0,difficulty="easy";
const difficulties={easy:{green:70,red:30,hole:50,step:.05},medium:{green:50,red:50,hole:50,step:.15},hard:{green:25,red:75,hole:61,step:.25}};

function resizeCanvas(){
  width=innerWidth;height=innerHeight;
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=width*dpr;canvas.height=height*dpr;canvas.style.width=width+"px";canvas.style.height=height+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  circle.radius=Math.min(205,width*.33,height*.30);
  circle.x=width/2;circle.y=height*.39;
  if(!gameRunning){ball.x=circle.x;ball.y=circle.y-circle.radius*.35;}
}
addEventListener("resize",resizeCanvas);
function normalizeAngle(a){a%=Math.PI*2;return a<0?a+Math.PI*2:a}
function angleDifference(a,b){let d=Math.abs(normalizeAngle(a)-normalizeAngle(b));return d>Math.PI?Math.PI*2-d:d}
function isHole(a){const h=difficulties[difficulty].hole*Math.PI/180;return angleDifference(a,holeAngle)<=h/2}
function limitSpeed(){
  ball.vx=Math.max(-MAX_HORIZONTAL_SPEED,Math.min(MAX_HORIZONTAL_SPEED,ball.vx));
  const sp=Math.hypot(ball.vx,ball.vy);
  if(sp>MAX_SPEED){const s=MAX_SPEED/sp;ball.vx*=s;ball.vy*=s;}
}
function chooseStartVelocity(){
  ball.vx=(Math.random()<.5?-1:1)*(1+Math.random()*1.3);
  ball.vy=1.8+Math.random()*1.2;
}
function registerBounce(nx,ny){
  bounceCount++;multiplier=Math.round((1+bounceCount*difficulties[difficulty].step)*100)/100;
  const jump=4.2+Math.random()*1.7,side=-2.8+Math.random()*5.6;
  if(ny>.12){ball.vy=-jump;ball.vx+=side}
  else if(ny<-.12){ball.vy=2.8+Math.random()*1.9;ball.vx+=side}
  else{ball.vy=Math.random()<.5?-(3.6+Math.random()*2.1):(3.4+Math.random()*2);ball.vx+=side}
  ball.vx+=-nx*(.15+Math.random()*.6);
  if(Math.abs(ball.vx)<.65)ball.vx=Math.random()<.5?-.65:.65;
  limitSpeed();updateUI();
}
function updateUI(){
  document.getElementById("gameBounces").textContent=bounceCount;
  document.getElementById("gameMultiplier").textContent=multiplier.toFixed(2)+"x";
  setBalance(balance);
}
function updateZones(){
  const d=difficulties[difficulty];
  document.getElementById("greenZone").style.width=d.green+"%";
  document.getElementById("redZone").style.width=d.red+"%";
}
async function startRound(){
  if(!userId){document.getElementById("gameBetError").textContent="Откройте игру через Telegram.";return}
  let bet=Number(document.getElementById("gameBet").value);
  const err=document.getElementById("gameBetError");
  if(!Number.isFinite(bet)||bet<25){err.textContent="Минимальная ставка 25 ⭐";return}
  bet=Math.round(bet*100)/100;
  if(bet>balance){err.textContent="Недостаточно средств.";return}
  currentBet=bet;
  const op="ball_bet:"+userId+":"+crypto.randomUUID();
  try{
    const d=await gameTransaction("deduct",bet,op);
    setBalance(d.balance);
  }catch(e){err.textContent=e.message;return}
  err.textContent="";
  gameRunning=true;escaped=false;gameFinished=false;bounceCount=0;multiplier=1;
  ball.x=circle.x;ball.y=circle.y-circle.radius*.35;chooseStartVelocity();
  document.getElementById("gameMenu").classList.add("hidden");
  document.getElementById("gameResult").classList.add("hidden");updateUI();
}
function escapeThroughHole(nx,ny){
  ball.x=circle.x+nx*(circle.radius+ball.radius+5);
  ball.y=circle.y+ny*(circle.radius+ball.radius+5);escaped=true;
}
function bounceFromWall(nx,ny){
  const safe=circle.radius-circle.wallWidth/2-ball.radius-1.5;
  ball.x=circle.x+nx*safe;ball.y=circle.y+ny*safe;
  const dot=ball.vx*nx+ball.vy*ny;
  if(dot>0){ball.vx-=2*dot*nx;ball.vy-=2*dot*ny}
  registerBounce(nx,ny);
}
async function finishGame(win){
  if(gameFinished)return;
  gameFinished=true;gameRunning=false;
  let payout=0,profit=-currentBet;
  if(win){payout=Math.round(currentBet*multiplier*100)/100;profit=payout-currentBet}
  if(payout>0){
    try{
      const d=await gameTransaction("add",payout,"ball_reward:"+userId+":"+crypto.randomUUID());
      setBalance(d.balance);
    }catch(e){
      document.getElementById("resultInfo").innerHTML="Ошибка начисления: "+e.message;
    }
  }
  const title=document.getElementById("resultTitle"),money=document.getElementById("resultMoney");
  title.textContent=win?"WIN":"LOSE";title.className="result-title "+(win?"win":"lose");
  money.textContent=(profit>=0?"+":"")+profit.toFixed(2)+" ⭐";money.className="result-money "+(win?"win":"lose");
  document.getElementById("resultInfo").innerHTML="Ставка: "+currentBet.toFixed(2)+" ⭐<br>Множитель: "+multiplier.toFixed(2)+"x<br>"+(win?"Выплата: "+payout.toFixed(2)+" ⭐":"Ставка проиграна.");
  document.getElementById("gameResult").classList.remove("hidden");
}
function updatePhysics(){
  holeAngle=normalizeAngle(holeAngle+HOLE_SPEED);
  if(!gameRunning)return;
  if(escaped){
    ball.vy+=GRAVITY;ball.x+=ball.vx;ball.y+=ball.vy;limitSpeed();
    if(ball.x-ball.radius<SIDE_WALL){ball.x=SIDE_WALL+ball.radius;ball.vx=Math.abs(ball.vx)}
    if(ball.x+ball.radius>width-SIDE_WALL){ball.x=width-SIDE_WALL-ball.radius;ball.vx=-Math.abs(ball.vx)}
    const top=height-ZONE_HEIGHT;
    if(ball.y+ball.radius>=top){finishGame(ball.x<=width*difficulties[difficulty].green/100);return}
    return;
  }
  ball.vy+=GRAVITY;ball.x+=ball.vx;ball.y+=ball.vy;limitSpeed();
  const dx=ball.x-circle.x,dy=ball.y-circle.y,dist=Math.hypot(dx,dy);
  const cr=circle.radius-circle.wallWidth/2-ball.radius;
  if(dist>=cr&&dist>.0001){
    const nx=dx/dist,ny=dy/dist,angle=Math.atan2(dy,dx);
    if(isHole(angle)&&(ball.vx*nx+ball.vy*ny)>=0){escapeThroughHole(nx,ny);return}
    bounceFromWall(nx,ny);
  }
}
function draw(){
  ctx.clearRect(0,0,width,height);
  ctx.fillStyle="#252a2f";ctx.fillRect(0,0,SIDE_WALL,height);ctx.fillRect(width-SIDE_WALL,0,SIDE_WALL,height);
  const r=circle.radius,h=difficulties[difficulty].hole*Math.PI/180,s=holeAngle-h/2,e=holeAngle+h/2;
  ctx.save();ctx.beginPath();ctx.arc(circle.x,circle.y,r,e,s+Math.PI*2);ctx.strokeStyle="#1478e8";ctx.lineWidth=circle.wallWidth;ctx.lineCap="round";ctx.shadowBlur=20;ctx.shadowColor="rgba(20,120,235,.8)";ctx.stroke();ctx.restore();
  ctx.save();ctx.strokeStyle="#1478e8";ctx.lineWidth=5;ctx.lineCap="round";
  for(const a of [s,e]){ctx.beginPath();ctx.moveTo(circle.x+Math.cos(a)*(r-6),circle.y+Math.sin(a)*(r-6));ctx.lineTo(circle.x+Math.cos(a)*(r+3),circle.y+Math.sin(a)*(r+3));ctx.stroke()}ctx.restore();
  ctx.save();ctx.beginPath();ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);ctx.fillStyle="#fff";ctx.shadowBlur=16;ctx.shadowColor="rgba(255,255,255,.95)";ctx.fill();ctx.restore();
  ctx.beginPath();ctx.arc(ball.x-4,ball.y-4,3,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
}
function loop(){updatePhysics();draw();requestAnimationFrame(loop)}
document.getElementById("openBall").onclick=async()=>{document.getElementById("gameScreen").classList.remove("hidden");resizeCanvas();updateZones();updateUI();await loadBalance()};
document.getElementById("exitGame").onclick=()=>{if(!gameRunning)document.getElementById("gameScreen").classList.add("hidden")};
document.getElementById("startGame").onclick=startRound;
document.getElementById("resultClose").onclick=()=>{document.getElementById("gameResult").classList.add("hidden");document.getElementById("gameMenu").classList.remove("hidden");gameRunning=false;gameFinished=false;escaped=false;bounceCount=0;multiplier=1;ball.x=circle.x;ball.y=circle.y-circle.radius*.35;ball.vx=0;ball.vy=0;loadBalance()};
document.querySelectorAll(".difficulty button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".difficulty button").forEach(x=>x.classList.remove("active"));b.classList.add("active");difficulty=b.dataset.difficulty;updateZones()});
document.getElementById("navMenu").onclick=()=>{};
document.getElementById("navInventory").onclick=()=>alert("Инвентарь пока отключён: сейчас в меню только одна игра — Шарик.");
document.getElementById("navProfile").onclick=()=>alert("Профиль будет добавлен после проверки игры.");
resizeCanvas();updateZones();updateUI();loadBalance();loop();
})();
</script>
</body>
</html>
